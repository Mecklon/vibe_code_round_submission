spring.application.name=demo
spring.config.import=optional:file:./.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chat_assistant}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.port=9090
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.7